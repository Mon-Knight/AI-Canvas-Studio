<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Flowboard 连接助手</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { color-scheme: dark; }

    body {
      width: 300px;
      background: #141417;
      color: #e6e8ec;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.5;
      margin: 0;
      padding: 0;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 12px 12px 8px;
      border-bottom: 1px solid #27272c;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #e6e8ec;
    }

    .header-version {
      font-size: 11px;
      color: #a1a1aa;
    }

    .section {
      padding: 8px 12px;
      border-bottom: 1px solid #27272c;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label {
      color: #a1a1aa;
      min-width: 52px;
      flex-shrink: 0;
    }

    .section-value {
      color: #e6e8ec;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot-connected { color: #6ee7b7; }
    .dot-running   { color: #f5b301; }
    .dot-offline   { color: #a1a1aa; }

    .error-value {
      color: #ef4444;
      font-size: 11px;
    }

    .actions {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    button {
      width: 100%;
      padding: 6px 10px;
      background: #27272c;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }

    button:hover {
      background: #343439;
      color: #e6e8ec;
    }

    button#btn-toggle.reconnect {
      color: #6ee7b7;
      border-color: #1e3a32;
    }

    button#btn-toggle.disconnect {
      color: #ef4444;
      border-color: #3a1e1e;
    }
    .pair-form {
      border-bottom: 1px solid #27272c;
      display: grid;
      gap: 7px;
      padding: 12px;
    }

    .pair-heading { font-size: 13px; font-weight: 650; }
    .pair-hint { color: #a1a1aa; }
    .pair-controls { display: flex; gap: 6px; }
    .pair-controls input {
      min-width: 0;
      flex: 1;
      padding: 7px 9px;
      color: #f4f4f6;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
    }
    .pair-controls button { width: auto; background: #f4f4f6; color: #09090b; }
    .pair-controls button:hover { background: white; }
    .pair-controls button:disabled { opacity: .55; cursor: default; }
    :is(button, input):focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
    .pair-result { color: #6ee7b7; overflow-wrap: anywhere; }
    .pair-result[data-error="true"] { color: #fda4af; }
    .pair-result:empty, [hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <span class="header-title">Flowboard 连接助手</span>
    <span class="header-version" id="version"></span>
  </header>

  <div class="section">
    <span class="section-label">连接状态</span>
    <span class="section-value" id="status-dot">○ 未连接</span>
  </div>

  <div class="section">
    <span class="section-label">兼容会话</span>
    <span class="section-value" id="token-row">暂无</span>
  </div>

  <div class="section">
    <span class="section-label">请求统计</span>
    <span class="section-value" id="stats-row">0 · ✓ 0 · ✗ 0</span>
  </div>

  <div class="section" id="error-section" style="display:none">
    <span class="section-label">错误</span>
    <span class="section-value error-value" id="error-row"></span>
  </div>

  <form class="pair-form" id="pair-form">
    <label class="pair-heading" for="pair-code">配对画布账号</label>
    <p class="pair-hint" id="pair-hint">在画布的「Flow 账号与积分」设置生成配对码，并在该账号对应的 Chrome 窗口中输入。</p>
    <div class="pair-controls">
      <input id="pair-code" type="text" required maxlength="128" autocomplete="off" spellcheck="false" placeholder="输入配对码" aria-describedby="pair-hint">
      <button type="submit" id="btn-pair">配对</button>
    </div>
    <p class="pair-result" id="pair-result" role="status" aria-live="polite"></p>
  </form>

  <div class="actions">
    <button id="btn-flow-tab">打开 Flow 网页</button>
    <button id="btn-refresh">刷新兼容会话</button>
    <button id="btn-toggle" class="disconnect">断开连接</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
