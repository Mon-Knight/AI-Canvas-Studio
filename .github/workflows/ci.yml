name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-desktop:
    name: Frontend & Desktop Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc -p . --noEmit
          npx vite build
          npm test

      - name: Install & verify desktop TypeScript
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm run build

  backend:
    name: Backend Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg for video concat tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install backend dependencies
        run: pip install -e "agent[dev]"

      - name: Lint & run full backend pytest suite
        run: |
          ruff check agent/flowboard --select E9,F63,F7,F82
          pytest agent/tests -q
