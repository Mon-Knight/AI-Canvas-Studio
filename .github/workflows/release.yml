name: Build & Release Windows Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v prefix)"
        required: true
        default: "0.9.2"
      publish_release:
        description: "Publish artifacts to GitHub Releases"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows x64 (Setup + Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent & PyInstaller
        run: pip install -e agent pyinstaller

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $ver = "${{ github.event.inputs.version }}"
          }
          if (-not $ver) { $ver = "0.9.2" }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$ver"

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          $defaultPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not $iscc -and -not (Test-Path $defaultPath)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows portable & installer packages
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -Version "$env:APP_VERSION" -PythonExe "$py"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Canvas-Studio-v${{ env.APP_VERSION }}-win64
          path: |
            release/AI-Canvas-Studio-v*.exe
            release/AI-Canvas-Studio-v*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: AI Canvas Studio v${{ env.APP_VERSION }}
          generate_release_notes: true
          make_latest: "true"
          files: |
            release/AI-Canvas-Studio-v*.exe
            release/AI-Canvas-Studio-v*.zip
            release/SHA256SUMS.txt
